[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datoso-dev"
description = "Release and maintenance tool for the datoso multi-repo workspace."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT License"}
authors = [{name = "Lacides Miranda"}]
dependencies = [
    "packaging>=23.0",
    "questionary>=2.0",
    "rich>=13.0",
    "typer>=0.12",
]
dynamic = ["version"]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
datoso-dev = "datoso_dev.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
datoso_dev = ["templates/*.yml"]

[tool.setuptools.dynamic]
version = {attr = "datoso_dev.__version__"}

# This repo is tooling, never released to PyPI by datoso-dev itself.
[tool.datoso-dev]
skip = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "integration: uses real git repositories in a temporary directory (offline)",
]

[tool.coverage.run]
source = ["datoso_dev"]
branch = true

# Same settings as the workspace root ruff.toml, inlined so CI (standalone repo) uses them too.
[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py311"
extend-exclude = ["lib", "make_prs.py", "make_release.py", "update_version.py"]  # legacy, removed in phase 5

[tool.ruff.lint]
select = ["ALL"]
ignore = ["T201", "D213", "D203", "INP001", "PTH123", "FIX002", "TD003", "CPY001", "COM812", "TC001", "TC002", "TC003"]

[tool.ruff.lint.per-file-ignores]
"src/datoso_dev/cli.py" = ["FBT001", "FBT002"]  # typer boolean options
"tests/**" = ["S101", "D", "ANN", "PLR2004", "S603", "S607", "ARG"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.format]
quote-style = "single"
